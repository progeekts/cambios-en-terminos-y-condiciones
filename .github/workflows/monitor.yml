name: Monitor Políticas Legales

on:
  schedule:
    - cron: '0 2 * * *' # Ejecución diaria a las 02:00 AM UTC
  workflow_dispatch:      # Permite ejecución manual desde la pestaña Actions

permissions:
  contents: write

jobs:
  scrape-and-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar rastreo y análisis de impacto
        run: python scripts/tracker.py

      - name: Guardar cambios si existen
        run: |
          git config --global user.name "PolicyTracker Bot"
          git config --global user.email "tracker-bot@users.noreply.github.com"
          git add tracked_policies/ docs/diffs.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: actualización de políticas y registro de diffs [$(date -u +'%Y-%m-%d')]"
            git push
          else
            echo "Sin cambios detectados en ninguna política."
          fi