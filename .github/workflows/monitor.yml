name: Monitor Políticas Legales

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: policy-monitor
  cancel-in-progress: false

jobs:
  scrape-and-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar clasificador
        run: python -m unittest discover -s tests

      - name: Ejecutar rastreo y análisis
        run: python scripts/tracker.py

      - name: Preparar paquete para hosting
        env:
          SITE_URL: https://progeekts.es/
        run: python scripts/build_hosting_package.py

      - name: Publicar paquete descargable
        uses: actions/upload-artifact@v4
        with:
          name: web-progeekts-es
          path: hosting-package/
          if-no-files-found: error
          retention-days: 30

      - name: Guardar resultados
        run: |
          git config user.name "PolicyTracker Bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add tracked_policies/ docs/diffs.json docs/status.json docs/feed.xml docs/atom.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualización del observatorio [$(date -u +'%Y-%m-%d')]"
            git push
          else
            echo "Sin cambios que guardar."
          fi
