name: Monitor Políticas Legales

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: policy-monitor
  cancel-in-progress: false

jobs:
  scrape-and-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar clasificador
        run: python -m unittest discover -s tests

      - name: Ejecutar rastreo y análisis
        run: python scripts/tracker.py

      - name: Preparar paquete para hosting
        env:
          SITE_URL: https://progeekts.es/tyc/
        run: python scripts/build_hosting_package.py

      - name: Publicar paquete descargable
        uses: actions/upload-artifact@v4
        with:
          name: web-progeekts-es
          path: hosting-package/
          if-no-files-found: error
          retention-days: 30

      - name: Desplegar web por SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          test -n "$SFTP_HOST" && test -n "$SFTP_PORT" && test -n "$SFTP_USERNAME" && test -n "$SFTP_PASSWORD" && test -n "$SFTP_REMOTE_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$SFTP_USERNAME,$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" -e "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 20; mirror -R --delete --verbose hosting-package/ $SFTP_REMOTE_PATH; bye"

      - name: Guardar resultados
        run: |
          git config user.name "PolicyTracker Bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add tracked_policies/ docs/diffs.json docs/status.json docs/feed.xml docs/atom.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualización del observatorio [$(date -u +'%Y-%m-%d')]"
            git push
          else
            echo "Sin cambios que guardar."
          fi
