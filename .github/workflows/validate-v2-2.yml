name: Validar V2.3

on:
  push:
    branches:
      - v2.3-historial-consulta
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-v2-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validar sintaxis del monitor
        run: python -m py_compile scripts/tracker.py

  live-diagnostic:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar monitor contra fuentes reales
        run: python scripts/tracker.py
      - name: Validar diagnóstico y feeds
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          with open('docs/status.json', encoding='utf-8') as f:
              status = json.load(f)
          with open('docs/diffs.json', encoding='utf-8') as f:
              diffs = json.load(f)
          assert status.get('schema_version') == 5
          assert status.get('ok') == status.get('targets'), status.get('errors')
          assert not status.get('errors'), status.get('errors')
          assert all(x.get('change_id') and x.get('permalink') for x in diffs)
          ET.parse('docs/feed.xml')
          ET.parse('docs/atom.xml')
          print(f"Fuentes: {status.get('ok')}/{status.get('targets')} correctas")
          print(f"Cambios históricos: {len(diffs)}")
          print('RSS y Atom: XML válido')
          PY
      - name: Publicar diagnóstico V2.3
        uses: actions/upload-artifact@v4
        with:
          name: v2-3-live-diagnostic
          path: |
            docs/status.json
            docs/diffs.json
            docs/feed.xml
            docs/atom.xml
          retention-days: 7
