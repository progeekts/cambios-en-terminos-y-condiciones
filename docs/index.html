<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observatorio de Términos de Servicio y Privacidad</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --green-bg: rgba(46, 160, 67, 0.15);
      --green-text: #3fb950;
      --red-bg: rgba(248, 81, 73, 0.15);
      --red-text: #f85149;
      --badge-high: #da3633;
      --badge-low: #388bfd;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .container { max-width: 1100px; margin: auto; }
    header { margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    h1 { margin: 0 0 0.5rem 0; font-size: 1.8rem; }
    p.subtitle { color: var(--text-muted); margin: 0; }
    .filters { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    select {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 6px;
    }
    .diff-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .card-header {
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
    }
    .badge {
      font-size: 0.75rem;
      font-weight: bold;
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      text-transform: uppercase;
    }
    .badge.alta { background-color: var(--badge-high); color: #fff; }
    .badge.baja { background-color: var(--badge-low); color: #fff; }
    .tags { margin-top: 0.5rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .tag {
      background: rgba(235, 126, 34, 0.15);
      color: #f0883e;
      border: 1px solid #f0883e;
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }
    .diff-viewer {
      padding: 1rem;
      font-family: monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      overflow-x: auto;
      line-height: 1.4;
    }
    .diff-line-add { background-color: var(--green-bg); color: var(--green-text); display: block; }
    .diff-line-del { background-color: var(--red-bg); color: var(--red-text); display: block; }
    .diff-line-info { color: var(--text-muted); display: block; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Observatorio de Políticas y Términos</h1>
      <p class="subtitle">Monitoreo y clasificación de cambios contractuales orientados a IA y cesión de datos.</p>
    </header>

    <div class="filters">
      <select id="severityFilter" onchange="renderCards()">
        <option value="all">Todas las alertas</option>
        <option value="Alta">Solo Alto Impacto</option>
        <option value="Baja">Bajo Impacto</option>
      </select>
    </div>

    <div id="feed">Cargando registros...</div>
  </div>

  <script>
    let diffEntries = [];

    async function loadData() {
      try {
        const response = await fetch('diffs.json');
        diffEntries = await response.json();
        renderCards();
      } catch (err) {
        document.getElementById('feed').innerHTML = '<p>No se encontraron registros de cambios recientes o aún no se ha ejecutado la primera comprobación.</p>';
      }
    }

    function renderDiff(text) {
      return text.split('\n').map(line => {
        const escaped = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        if (line.startsWith('+') && !line.startsWith('+++')) return `<span class="diff-line-add">${escaped}</span>`;
        if (line.startsWith('-') && !line.startsWith('---')) return `<span class="diff-line-del">${escaped}</span>`;
        if (line.startsWith('@@')) return `<span class="diff-line-info">${escaped}</span>`;
        return `<span>${escaped}</span>`;
      }).join('');
    }

    function renderCards() {
      const filter = document.getElementById('severityFilter').value;
      const feed = document.getElementById('feed');
      
      const filtered = diffEntries.filter(e => filter === 'all' || e.severity === filter);

      if (filtered.length === 0) {
        feed.innerHTML = '<p>No hay cambios que coincidan con los criterios de búsqueda.</p>';
        return;
      }

      feed.innerHTML = filtered.map(item => `
        <div class="diff-card">
          <div class="card-header">
            <div>
              <strong>${item.platform}</strong> — <a href="${item.url}" target="_blank" style="color:var(--text);">${item.type}</a>
              <div style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Detectado: ${item.date}</div>
              <div class="tags">
                ${(item.impacts || []).map(imp => `<span class="tag">${imp}</span>`).join('')}
              </div>
            </div>
            <span class="badge ${item.severity.toLowerCase()}">${item.severity}</span>
          </div>
          <div class="diff-viewer">${renderDiff(item.raw_diff)}</div>
        </div>
      `).join('');
    }

    loadData();
  </script>
</body>
</html>
