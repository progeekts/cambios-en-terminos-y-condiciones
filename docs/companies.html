<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Expedientes por empresa del Observatorio de Cambios."><title>Empresas · Observatorio de Cambios</title><style>:root{--bg:#f4f7fb;--p:#fff;--b:#dfe6ef;--t:#142033;--m:#65748a;--a:#5b5cf0;--g:#15966a;--r:#d84b62;--y:#b7791f;--shadow:0 18px 50px rgba(29,45,72,.08)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef2ff,#f7f9fc 320px,#f4f7fb);color:var(--t);font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1160px,calc(100% - 30px));margin:auto}nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--b)}nav .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 0}a{color:var(--a)}nav a{text-decoration:none}.brand{font-weight:850}.brand:before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:10px;background:linear-gradient(135deg,var(--a),#8b5cf6);box-shadow:0 0 0 5px rgba(91,92,240,.1)}header{padding:62px 0 28px}h1{font-size:clamp(40px,6vw,68px);line-height:1;letter-spacing:-.05em;margin:9px 0 16px}.ey{color:var(--a);font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:.12em}.muted{color:var(--m)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 30px}.summary div,.card{background:var(--p);border:1px solid var(--b);border-radius:16px;box-shadow:var(--shadow)}.summary div{padding:16px}.summary b{font-size:27px;display:block}.toolbar{display:flex;gap:10px;margin:20px 0}.toolbar input{width:100%;padding:12px 14px;border:1px solid #d7e0eb;border-radius:11px;background:#fff;font:inherit;outline:none}.toolbar input:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(91,92,240,.1)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin:20px 0 55px}.card{padding:22px;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#c7d0df}.top{display:flex;justify-content:space-between;gap:12px}.card h2{margin:2px 0 4px;font-size:24px}.health{font-size:11px;font-weight:800;border-radius:999px;padding:5px 9px;height:max-content;background:#eef8f4;color:var(--g)}.health.warn{background:#fff7e8;color:var(--y)}.stats{display:flex;gap:18px;font-size:13px;margin:14px 0}.stats b{font-size:18px;color:var(--t)}.docs{display:flex;gap:6px;flex-wrap:wrap}.doc{font-size:11px;background:#f4f6fa;border:1px solid #e1e7ef;border-radius:7px;padding:4px 7px}.latest{border-top:1px solid var(--b);padding-top:14px;margin-top:16px}.latest-title{display:flex;justify-content:space-between;gap:10px}.sev{font-size:11px;font-weight:850}.Alta{color:var(--r)}.Media{color:var(--y)}.Baja{color:#4058bf}.summarytxt{margin:7px 0;color:#45566d}.topics{font-size:12px;color:var(--m);margin-top:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{display:inline-block;text-decoration:none;background:linear-gradient(135deg,var(--a),#7475f5);color:#fff;font-weight:800;padding:9px 12px;border-radius:9px}.btn.secondary{background:#f7f9fc;color:#405068;border:1px solid #dbe3ed}.empty{padding:35px;text-align:center;color:var(--m);border:1px dashed var(--b);border-radius:14px}@media(max-width:760px){header{padding-top:40px}.grid,.summary{grid-template-columns:1fr}.top{align-items:flex-start}}</style></head><body><nav><div class="wrap"><div class="brand">Observatorio de Cambios</div><a href="index.html">← Volver al radar</a></div></nav><header class="wrap"><div class="ey">Expedientes de servicios</div><h1>Empresas vigiladas</h1><p class="muted">Cada ficha reúne los documentos monitorizados, salud de las fuentes, actividad registrada y materias afectadas.</p></header><main class="wrap"><section class="summary"><div><b id="companies">—</b><span class="muted">empresas vigiladas</span></div><div><b id="documents">—</b><span class="muted">documentos monitorizados</span></div><div><b id="changes">—</b><span class="muted">cambios registrados</span></div></section><div class="toolbar"><input id="search" type="search" placeholder="Buscar empresa, documento o materia…"></div><div id="grid" class="grid">Cargando expedientes…</div></main><script>const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let companies=[];function cats(e){return e.categories||e.impacts||[]}function sev(e){return e.relevance||e.severity||'Baja'}function render(){let q=$('search').value.toLowerCase().trim(),data=companies.filter(x=>!q||[x.name,...x.docs,...x.changes.flatMap(cats)].join(' ').toLowerCase().includes(q));$('grid').innerHTML=data.length?data.map(x=>{let latest=x.changes[0],topics=[...new Set(x.changes.flatMap(cats))],healthy=x.total&&x.ok===x.total;return '<article class="card"><div class="top"><div><div class="ey">Expediente de servicio</div><h2>'+esc(x.name)+'</h2></div><span class="health '+(healthy?'':'warn')+'">'+x.ok+'/'+x.total+' fuentes correctas</span></div><div class="stats"><span><b>'+x.docs.size+'</b> documentos</span><span><b>'+x.changes.length+'</b> cambios</span></div><div class="docs">'+[...x.docs].map(d=>'<span class="doc">'+esc(d)+'</span>').join('')+'</div><div class="latest">'+(latest?'<div class="latest-title"><strong>Último cambio · '+esc(latest.date)+'</strong><span class="sev '+esc(sev(latest))+'">'+esc(sev(latest))+'</span></div><p class="summarytxt">'+esc(latest.summary||'Cambio registrado.')+'</p><div class="topics">'+(topics.length?'Materias observadas: '+topics.map(esc).join(' · '):'Pendiente de clasificación temática')+'</div>':'<span class="muted">Sin cambios registrados todavía. La fuente permanece bajo vigilancia.</span>')+'</div><div class="actions"><a class="btn" href="index.html?empresa='+encodeURIComponent(x.name)+'#cambios">Abrir historial →</a></div></article>'}).join(''):'<div class="empty">No hay empresas que coincidan con la búsqueda.</div>'}Promise.all([fetch('diffs.json',{cache:'no-store'}).then(r=>r.json()),fetch('status.json',{cache:'no-store'}).then(r=>r.json())]).then(([entries,status])=>{let map=new Map;for(let s of status.sources||[]){let x=map.get(s.platform)||{name:s.platform,docs:new Set,changes:[],ok:0,total:0};x.docs.add(s.document_type);x.total++;if(['ok','initialized'].includes(s.state))x.ok++;map.set(s.platform,x)}for(let e of entries){let x=map.get(e.platform)||{name:e.platform,docs:new Set,changes:[],ok:0,total:0};x.docs.add(e.document_type||e.type||'Otro documento');x.changes.push(e);map.set(e.platform,x)}companies=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name));$('companies').textContent=companies.length;$('documents').textContent=companies.reduce((n,x)=>n+x.docs.size,0);$('changes').textContent=entries.length;$('search').addEventListener('input',render);render()}).catch(()=>$('grid').innerHTML='<div class="empty">No se pudieron cargar los expedientes.</div>');</script></body></html>
