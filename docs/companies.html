<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Historial de cambios por empresa en términos, privacidad y otras condiciones digitales."><title>Empresas · Observatorio de Cambios</title><style>:root{--bg:#071018;--p:#0f1722;--b:#253244;--t:#eef4fb;--m:#91a0b3;--a:#6eb1ff;--g:#44d17a;--r:#ff7188}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1120px,calc(100% - 30px));margin:auto}nav{border-bottom:1px solid var(--b);padding:15px 0}nav .wrap{display:flex;justify-content:space-between;gap:20px}a{color:var(--a)}header{padding:55px 0 25px}h1{font-size:clamp(38px,6vw,64px);line-height:1;margin:8px 0}.ey{color:var(--a);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.muted{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px 0 50px}.card{background:var(--p);border:1px solid var(--b);border-radius:16px;padding:20px}.card h2{margin:0 0 5px}.stats{display:flex;gap:14px;color:var(--m);font-size:13px;margin:12px 0}.latest{border-top:1px solid var(--b);padding-top:12px;margin-top:12px}.btn{display:inline-block;text-decoration:none;background:var(--a);color:#071018;font-weight:800;padding:8px 11px;border-radius:9px;margin-top:12px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:580px){.grid{grid-template-columns:1fr}}</style></head><body><nav><div class="wrap"><strong>Observatorio de Cambios</strong><a href="index.html">← Volver al radar</a></div></nav><header class="wrap"><div class="ey">Historial por servicio</div><h1>Empresas vigiladas</h1><p class="muted">Consulta qué documentos seguimos y el historial de modificaciones registrado para cada servicio.</p></header><main class="wrap"><div id="grid" class="grid">Cargando…</div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));Promise.all([fetch('diffs.json',{cache:'no-store'}).then(r=>r.json()),fetch('status.json',{cache:'no-store'}).then(r=>r.json())]).then(([entries,status])=>{let map=new Map;for(let s of status.sources||[]){let x=map.get(s.platform)||{name:s.platform,docs:new Set,changes:[],ok:0,total:0};x.docs.add(s.document_type);x.total++;if(['ok','initialized'].includes(s.state))x.ok++;map.set(s.platform,x)}for(let e of entries){let x=map.get(e.platform)||{name:e.platform,docs:new Set,changes:[],ok:0,total:0};x.docs.add(e.document_type||e.type);x.changes.push(e);map.set(e.platform,x)}let cards=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name)).map(x=>{let latest=x.changes[0];return `<article class="card"><div class="ey">${x.ok}/${x.total||x.docs.size} fuentes correctas</div><h2>${esc(x.name)}</h2><div class="stats"><span>${x.docs.size} documento${x.docs.size===1?'':'s'}</span><span>${x.changes.length} cambio${x.changes.length===1?'':'s'}</span></div><div class="muted">${[...x.docs].map(esc).join(' · ')}</div><div class="latest">${latest?`<strong>Último cambio</strong><div class="muted">${esc(latest.date)} · ${esc(latest.relevance||latest.severity||'Baja')}</div><div>${esc(latest.summary||'Cambio registrado.')}</div>`:'<span class="muted">Sin cambios registrados todavía.</span>'}</div><a class="btn" href="index.html?empresa=${encodeURIComponent(x.name)}#cambios">Ver historial →</a></article>`}).join('');document.getElementById('grid').innerHTML=cards||'<p class="muted">No hay empresas disponibles.</p>'}).catch(()=>document.getElementById('grid').innerHTML='<p class="muted">No se pudo cargar el historial.</p>');</script></body></html>
